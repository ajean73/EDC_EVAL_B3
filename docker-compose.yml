services:
  db:
    image: postgres:16-alpine
    container_name: pmt-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmt_db}
      POSTGRES_USER: ${POSTGRES_USER:-pmt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bdd/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: pmt-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pmt_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pmt_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@pmt.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SERVER_PORT: 8080
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: pmt-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
