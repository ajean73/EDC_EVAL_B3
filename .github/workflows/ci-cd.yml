name: intégration-et-déploiement-continus

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, branches/**]

jobs:
  backend-tests:
    name: Tests du backend
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Exécuter les tests backend et le seuil de couverture
        run: mvn -B verify

      - name: Publier le rapport de couverture backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            couvertures/backend/**
            target/surefire-reports/**

  frontend-tests:
    name: Tests du frontend
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm install

      - name: Exécuter les tests frontend et le seuil de couverture
        working-directory: frontend
        run: npm run test:ci

      - name: Publier le rapport de couverture frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: couvertures/frontend/**

  build-images:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend.Dockerfile
          push: false
          tags: local/pmt-backend:${{ github.sha }}

      - name: Construire l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend.Dockerfile
          push: false
          tags: local/pmt-frontend:${{ github.sha }}

  deploy-images:
    name: Déploiement des images Docker
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_BACKEND_IMAGE }}:${{ github.sha }}

      - name: Construire et publier l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_FRONTEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Démarrer la stack avec Docker Compose
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SPRING_PROFILES_ACTIVE: prod
          APP_MAIL_ENABLED: ${{ vars.APP_MAIL_ENABLED }}
          APP_MAIL_FROM: ${{ vars.APP_MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          docker compose up -d --build
          docker compose ps
