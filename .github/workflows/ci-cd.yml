name: integration-et-deploiement-continus

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, branches/**]

jobs:
  backend-tests:
    name: Tests du backend
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executer les tests backend et le seuil de couverture
        run: mvn -B verify

      - name: Publier le rapport de couverture backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            couvertures/backend/**
            target/surefire-reports/**

  frontend-tests:
    name: Tests du frontend
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances frontend
        working-directory: frontend
        run: npm install

      - name: Executer les tests frontend et le seuil de couverture
        working-directory: frontend
        run: npm run test:ci

      - name: Publier le rapport de couverture frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: couvertures/frontend/**

  build-images:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend.Dockerfile
          push: false
          tags: local/pmt-backend:${{ github.sha }}

      - name: Construire l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend.Dockerfile
          push: false
          tags: local/pmt-frontend:${{ github.sha }}

  deploy-images:
    name: Deploiement des images Docker
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_BACKEND_IMAGE }}:${{ github.sha }}

      - name: Construire et publier l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_FRONTEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_FRONTEND_IMAGE }}:${{ github.sha }}
